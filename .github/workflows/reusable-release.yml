name: Reusable release
on:
  workflow_call:
    inputs:
      artifact_serial:
        type: string
        required: true
      release_tag:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: wine-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      artifact_serial: ${{ inputs.artifact_serial }}
      attest: true
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wine-*
          path: out
          merge-multiple: true
      - name: Verify provenance and assemble draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          python3 tools/release.py "$TAG" out --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
