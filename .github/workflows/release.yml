name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      serial:
        description: Artifact revision for the pinned Wine version
        type: number
        default: 1
        required: true
      attest:
        description: Generate GitHub attestations (requires repository support)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      serial: ${{ inputs.serial }}
      attest: ${{ inputs.attest }}

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: wine-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SERIAL: ${{ inputs.serial }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wine-*
          path: out
          merge-multiple: true
      - name: Create immutable draft assets
        run: |
          version=$(python3 -c 'import json; print(json.load(open("sources.json"))["wine"]["version"])')
          gh release create "wine-$version-$SERIAL" out/* --draft \
            --target "$GITHUB_SHA" --title "Wine $version, artifact $SERIAL" \
            --notes-file .github/release-notes.md
