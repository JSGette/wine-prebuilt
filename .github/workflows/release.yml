name: Release
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag; dispatch this workflow at that tag's ref
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      serial: ${{ steps.prepare.outputs.serial }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check release tag against pinned inputs and workflow commit
        id: prepare
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare-release.py "$TAG" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
  release:
    needs: prepare
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      artifact_serial: ${{ needs.prepare.outputs.serial }}
      release_tag: ${{ needs.prepare.outputs.tag }}
